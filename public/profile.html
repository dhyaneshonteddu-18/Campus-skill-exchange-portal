<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Campus Skill Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">🎓 Skill Exchange</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" id="nav-login" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-register" href="register.html">Register</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-dashboard" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link active" id="nav-profile" href="profile.html">Profile</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-skills" href="skills.html">Find Skills</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-requests" href="requests.html">Requests</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-materials" href="materials.html">Materials</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-logout" href="#" onclick="logout(); return false;">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-40 mb-40">
    <h2 class="mb-30">My Profile</h2>

    <!-- Profile Header -->
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">A</div>
      <div class="profile-info">
        <h2 id="userName">-</h2>
        <p id="userEmail">-</p>
        <p id="userDept">-</p>
        <p id="userYear">-</p>
      </div>
    </div>

    <!-- Edit Form -->
    <div class="card mt-40">
      <div class="card-header">
        <h5>Edit Profile</h5>
      </div>
      <div class="card-body">
        <form id="editProfileForm">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="editName">Full Name</label>
                <input type="text" id="editName" name="name" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="editDepartment">Department</label>
                <select id="editDepartment" name="department" required>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Mechanical">Mechanical</option>
                  <option value="Civil">Civil</option>
                  <option value="Electrical">Electrical</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="editYear">Year of Study</label>
                <select id="editYear" name="year" required>
                  <option value="1st">1st Year</option>
                  <option value="2nd">2nd Year</option>
                  <option value="3rd">3rd Year</option>
                  <option value="4th">4th Year</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="editBio">Bio</label>
            <textarea id="editBio" name="bio" rows="4" placeholder="Tell us about yourself..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>

    <!-- Skills Section -->
    <div class="card mt-40">
      <div class="card-header">
        <h5>Your Skills</h5>
      </div>
      <div class="card-body">
        <div id="skillsList"></div>
        <button class="btn btn-success mt-20" data-bs-toggle="modal" data-bs-target="#addSkillModal">+ Add New Skill</button>
      </div>
    </div>
  </div>

  <!-- Add Skill Modal -->
  <div class="modal fade" id="addSkillModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Skill</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addSkillForm">
            <div class="form-group">
              <label for="skillName">Skill Name *</label>
              <input type="text" id="skillName" name="skillName" required placeholder="e.g., Python">
            </div>
            <div class="form-group">
              <label for="skillDescription">Description *</label>
              <textarea id="skillDescription" name="description" rows="4" required placeholder="Describe your expertise..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="submitAddSkill()">Add Skill</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 Campus Skill Exchange Portal. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
