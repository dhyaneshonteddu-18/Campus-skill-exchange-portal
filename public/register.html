<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Skill Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">🎓 Skill Exchange</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" id="nav-login" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-register" href="register.html">Register</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-dashboard" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-profile" href="profile.html">Profile</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-skills" href="skills.html">Find Skills</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-requests" href="requests.html">Requests</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-materials" href="materials.html">Materials</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-logout" href="#" onclick="logout(); return false;">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-40 mb-40">
    <div class="form-container">
      <h2 class="text-center mb-40">Create Your Account</h2>
      
      <div id="alert-container"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password (min 6 characters) *</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>

        <div class="form-group">
          <label for="department">Department *</label>
          <select id="department" name="department" required>
            <option value="">Select Department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Electrical">Electrical</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="year">Year of Study *</label>
          <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="1st">1st Year</option>
            <option value="2nd">2nd Year</option>
            <option value="3rd">3rd Year</option>
            <option value="4th">4th Year</option>
          </select>
        </div>

        <div class="form-group">
          <label for="bio">Short Bio</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Tell us a bit about yourself..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>

      <p class="text-center mt-20">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 Campus Skill Exchange Portal. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
