<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Skill Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">🎓 Skill Exchange</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" id="nav-login" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-register" href="register.html">Register</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-dashboard" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-profile" href="profile.html">Profile</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-skills" href="skills.html">Find Skills</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-requests" href="requests.html">Requests</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-materials" href="materials.html">Materials</a>
          </li>
          <li class="nav-item hidden">
            <a class="nav-link" id="nav-logout" href="#" onclick="logout(); return false;">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-40 mb-40">
    <div class="form-container">
      <h2 class="text-center mb-40">Login to Your Account</h2>
      
      <div id="alert-container"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <p class="text-center mt-20">
        Don't have an account? <a href="register.html">Register here</a>
      </p>

      <div style="background-color: #f0f9ff; padding: 15px; border-radius: 5px; margin-top: 20px; border-left: 4px solid var(--primary-color);">
        <p style="margin: 0; font-size: 0.9rem; color: #0c2d6b;">
          <strong>Demo Login:</strong><br>
          Email: rahul@college.edu<br>
          Password: password123
        </p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 Campus Skill Exchange Portal. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
